[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapperAmazon"
version = "1.0.0"
description = "A powerful CLI tool to scrape Amazon products across multiple countries"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Amen Allah Hadded", email = "amenallahhadde6@gmail.com" }
]
keywords = [
    "amazon",
    "scraper",
    "cli",
    "selenium",
    "web-scraping",
    "e-commerce",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "selenium>=4.0.0",
    "webdriver-manager>=4.0.0",
    "parsel>=1.7.0",
    "requests>=2.28.0",
    "click>=8.0.0",
]

[project.urls]
"Homepage" = "https://github.com/amen-hadded/scrapperamazon"
"Bug Tracker" = "https://github.com/amen-hadded/scrapperamazon/issues"
"Documentation" = "https://github.com/amen-hadded/scrapperamazon#readme"
"Source Code" = "https://github.com/amen-hadded/scrapperamazon"

[project.scripts]
scrapperAmazon = "scrapperamazon.cli:main"

[tool.setuptools]
packages = ["scrapperamazon"]

[tool.setuptools.package-data]
scrapperamazon = ["py.typed"]
